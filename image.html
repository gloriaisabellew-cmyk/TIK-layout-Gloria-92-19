<!DOCTYPE html>
<head>
    <title>Image HTML dan CSS </title>
    <link rel="stylesheet" href="image.css">
</head>
<body>
    <center>
    <p>Ini adalah Gambar ukuran normal</p>
    <!-- cara menambahkan gambar, format image: .jpg/.jpeg/.png/.gif -->
     <img src="download.png" alt="Jesus image">

     <!-- Ini cara merubah ukuran gambar -->
      <p>Ini adalah gambar yang sudah diganti ukurannya</p>
      <img src="download.png" alt="Jesus Image" class="ukuran">

      <!-- cara menambahkan lengkungan pada setiap sudut -->
       <p>ini adalah gambar yang sudah diberikan lengkungan</p>
       <img src="download.png" alt="Jesus image" class="lengkungan">

       <!-- cara menambahkan border pada gambar -->
        <p>Ini adalah gambar yang ada bordernya</p>
        <img src="download.png" alt="Jesus Image" class="border">
        <!-- cara menggabungkan gambar dan teks -->
         <div class="kelompok">
            <img src="download.png" alt="Jesus Image">
            <p>gambar Jesus</p>
         </div>
         <!-- cara menambahkan efek hover -->
<div class="efek">
    <img src="download.png" alt="Jesus IMage">
    <p>ini contoh hover</p>
</div>


        </center>
</body>
